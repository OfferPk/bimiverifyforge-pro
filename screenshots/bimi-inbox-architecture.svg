<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchBimi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchBimi)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    BIMI Architecture: Non-Compliant Fallback vs Verified Brand Assertion
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140e18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Dirty SVG &amp; Permissive DMARC
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#0a0d1e" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">DMARC: p=none &bull; SVG: version 1.1 (Non-square)</text>
  <text x="70" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Forbidden &lt;script&gt; &bull; No VMC Certificate</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">INBOX FALLBACK &amp; BRAND DAMAGE:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Mailbox parsers reject SVG: fails Tiny-PS profile</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; DMARC p=none fails mandatory BIMI security gate</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Gmail renders generic grey circle with letter "L"</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Zero brand distinction from malicious spear-phishers</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">FAILED BRAND ASSERTION &amp; REDUCED OPEN RATES</text>

  <!-- Right: Hardened Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#091826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: BIMIVerifyForge Pro Zero-Trust Standard
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#0a0d1e" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">DMARC: p=reject &bull; SVG Tiny-PS: 1:1 Square</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Active DigiCert VMC &bull; Registered Trademark</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ZERO-TRUST SECURITY GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; SVG sanitized to strict Tiny-PS specification</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Enforced DMARC p=reject blocks spoofed domain impostors</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Gmail renders official logo + Blue Verified Checkmark</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Apple Mail displays high-resolution square brand logo</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">+30% INBOX ENGAGEMENT &amp; INSTANT BRAND TRUST</text>
</svg>
